project:
  name: cpp_dlc_live
  session_id: auto_timestamp
  out_dir: D:\Data\LiuZY\Code\DeeplabcutCPP\output
fixed_fps: 20
camera:
  source: 0
  width: 1280
  height: 720
  fps_target: 20
  enforce_fps: true
  auto_exposure: false
  exposure: -4.0
  gain: 0.0
  flip: false
  rotate_deg: 0
dlc:
  strict_runtime: false
  model_path: D:\Data\LiuZY\Code\DeeplabcutCPP\Deeplabcut-CPP\model\2chamberCPP\DLC_RTCPP_resnet_50_iteration-0_shuffle-1_snapshot-best-60.pt
  backend: pytorch
  device: cuda:0
  bodypart: center              # 控制用代表点（ROI/激光）
  display_bodyparts: [center]   # 仅用于预览叠加,可选 [head, tail, center] 
  p_thresh: 0.6
  smoothing:
    enabled: true
    window: 5
roi:
  type: polygon
  chamber2:
  - - 265
    - 190
  - - 265
    - 540
  - - 615
    - 540
  - - 615
    - 190
  - - 265
    - 190
  chamber1:
  - - 615
    - 190
  - - 965
    - 190
  - - 965
    - 540
  - - 615
    - 540
  - - 615
    - 190
  strategy_on_neutral: 'off'
  debounce_frames: 8
laser_control:
  enabled: true
  on_chambers: [chamber1]   # 也可 [chamber1, chamber2] / [neutral]
  mode: startstop
  freq_hz: 20.0
  duty_cycle: 0.05
  ctr_channel: cDAQ1Mod4/ctr0
  pulse_term: /cDAQ1Mod4/PFI0
  enable_line: cDAQ1Mod4/port0/line0
  min_on_s: 0.001
  min_off_s: 0.001
  unknown_policy: 'off'
  fallback_to_dryrun: true

analysis:
  auto_after_run: true
  cm_per_px: null
  # Legacy per-analysis fixed FPS. Prefer top-level fixed_fps for unified behavior.
  fixed_fps_hz: 20
  output_plots: true

# Optional pre-experiment acclimation period (preview only, no saving/no logging).
acclimation:
  enabled: true
  duration_s: 0

preview_recording:
  enabled: true
  filename: preview_overlay.mp4
  codec: mp4v
  fps: 20
  overlay: true
raw_recording:
  enabled: true
  filename: raw_video.mp4
  codec: mp4v
  fps: 20
runtime_logging:
  enabled: true
  issue_events_file: issue_events.jsonl
  heartbeat_interval_s: 5.0
  low_conf_warn_every_n: 30
  inference_warn_ms: 80.0
  fps_warn_below: 18.0
